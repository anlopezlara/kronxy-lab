version: '3.8'

services:

  kronxy.api:
    image: ${DOCKER_REGISTRY-}kronxyapi
    container_name: Kronxy.Api
    build:
      context: .
      dockerfile: src/Kronxy.Api/Dockerfile
    depends_on:
      - kronxy-db

  kronxy-db:
    image: postgres:16
    container_name: Kronxy.Db
    environment:
      POSTGRES_DB: ${KRONXY_DB_NAME:-kronxy}
      POSTGRES_USER: ${KRONXY_DB_USER:-kronxy_app}
      POSTGRES_PASSWORD: ${KRONXY_DB_PASSWORD:?KRONXY_DB_PASSWORD must be defined}
    volumes:
      - kronxy-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${KRONXY_DB_PORT:-5432}:5432"

volumes:
  kronxy-postgres-data:
